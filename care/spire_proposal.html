<!doctype html>
<html>
<head>
  <meta charset="utf8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow" />
  <title>Verada for Spire</title>
  <style>
    /* Layout: shared cover + status, then four audience tabs (Operations/Clinical/Finance/Governance). Register follows the audience. Verada brand, committed light design on warm paper. */
    :root{
      --purple:#3D1450;
      --magenta:#C21A7B;
      --teal:#1A6E63;
      --tint:#F2E9F4;
      --tint2:#FBF4F8;
      --ink:#222222;
      --grey:#595959;
      --paper:#FBFAF7;
      --card:#FFFFFF;
      --border:#E7DDEC;
      --rule:#D9C9E0;
      color-scheme: light;
      --maxw: 900px;
    }
    /* Commits to one light world; stay legible on a dark host background with an explicit paper ground. */
    @media (prefers-color-scheme: dark){
      :root:not([data-theme="light"]){ color-scheme: light; }
    }
    *{box-sizing:border-box}
    body{background:var(--paper); color:var(--ink); font-family:Arial,"Helvetica Neue",Helvetica,sans-serif; line-height:1.55; margin:0}
    .wrap{max-width:var(--maxw); margin:0 auto;
      padding-left:max(16px, env(safe-area-inset-left,0px));
      padding-right:max(16px, env(safe-area-inset-right,0px));}
    section.block{padding-block:40px; border-bottom:1px solid var(--border)}
    h1,h2,h3,h4{text-wrap:balance; margin:0}
    .eyebrow{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--magenta); font-weight:bold}
    .rule{height:3px; width:64px; background:var(--magenta); border:none; margin:14px 0 20px}
    .muted{color:var(--grey)}
    .tiny{font-size:11px; color:var(--grey)}
    h2.sec{font-size:25px; color:var(--purple)}
    .sec-sub{font-size:16px; color:var(--grey); margin-top:4px; max-width:64ch}
    p{margin:0 0 14px}

    /* ---- Cover ---- */
    .cover{background:linear-gradient(160deg,var(--purple) 0%, #2a0e38 100%); color:#fff}
    .cover .wrap{padding-block:52px}
    
    .brandrow{display:flex; align-items:center; gap:16px; margin-bottom:36px}
    .brand-img-logo{height:38px; width:auto; object-fit:contain; flex:0 0 auto; display:block}
    .brand-text-block{display:flex; flex-direction:column; justify-content:center}
    .brandname{font-weight:bold; font-size:18px; letter-spacing:.02em; line-height:1.2}
    .brandsub{font-size:11px; color:#d9c2e6; letter-spacing:.04em; line-height:1.2; margin-top:2px}
    
    .cover h1{font-size:38px; line-height:1.1; margin-top:8px; max-width:17ch}
    .cover .accent{color:#F39FD0}
    .cover .coversub{font-size:17px; color:#e6d6ef; margin-top:16px; max-width:56ch}
    .preparedfor{margin-top:34px; display:inline-flex; flex-direction:column; gap:3px; border-left:3px solid var(--magenta); padding:8px 0 8px 16px}
    .preparedfor .k{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:#d9c2e6}
    .preparedfor .v{font-size:20px; font-weight:bold}
    .coverfoot{margin-top:38px; display:flex; flex-wrap:wrap; gap:10px}
    .coverfoot .pill{border:1px solid rgba(255,255,255,.28); border-radius:999px; padding:5px 12px; font-size:12px; color:#d9c2e6}

    /* ---- status ---- */
    .status{background:var(--tint2); border:1px solid var(--rule); border-left:4px solid var(--magenta); border-radius:8px; padding:14px 16px; font-size:13px; margin-bottom: 24px;}
    .status b{color:var(--purple)}

    /* ---- tabs ---- */
    .tabsbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--paper); border-bottom:1px solid var(--border)}
    .tabsbar .wrap{display:flex; flex-wrap:wrap; gap:4px; padding-block:8px}
    .tab{appearance:none; border:none; background:transparent; font-family:inherit; cursor:pointer;
      font-size:13.5px; font-weight:bold; color:var(--grey); padding:9px 14px; border-radius:8px; letter-spacing:.01em}
    .tab small{display:block; font-weight:normal; font-size:10.5px; letter-spacing:.04em; color:var(--grey); margin-top:1px}
    .tab[aria-selected="true"]{background:var(--purple); color:#fff}
    .tab[aria-selected="true"] small{color:#d9c2e6}
    .tab:focus-visible{outline:2px solid var(--magenta); outline-offset:2px}
    body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); background:var(--paper); z-index:10}

    .panel[hidden]{display:none!important}

    /* ---- shared components ---- */
    .grid2{display:grid; grid-template-columns:repeat(2,1fr); gap:16px}
    .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
    .cardbox{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px; margin-bottom:16px}
    .cardbox h3{font-size:16px; color:var(--purple); margin-bottom:6px}
    .cardbox p{font-size:14px; color:var(--grey); margin:0}
    .leadin{color:var(--ink); font-weight:bold}

    .statband{display:grid; grid-template-columns:repeat(2,1fr); gap:16px; margin-top:8px; margin-bottom:16px}
    .stat{border-left:3px solid var(--teal); padding:4px 0 4px 16px}
    .stat .fig {font-size:28px; font-weight:bold; color:var(--magenta); line-height:1; font-variant-numeric:tabular-nums}
    .stat p{margin:8px 0 0; font-size:13.5px; color:var(--ink)}

    .chips{display:flex; flex-wrap:wrap; gap:9px; margin:4px 0 16px}
    .chip{border:1px solid var(--rule); border-radius:8px; padding:8px 12px; font-size:12.5px; font-weight:bold; color:var(--purple); background:var(--tint2)}

    .metrics{display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-bottom:16px}
    .metric{display:flex; gap:12px; align-items:baseline; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px}
    .metric .fig{font-size:21px; font-weight:bold; color:var(--magenta); flex:0 0 auto; font-variant-numeric:tabular-nums}
    .metric .lab{font-size:13px; color:var(--grey)}

    .attrib{margin-top:14px; font-size:11.5px; color:var(--grey); font-style:italic}

    ul.list{margin:0 0 20px; padding:0; list-style:none; display:flex; flex-direction:column; gap:11px}
    ul.list li{font-size:14px; color:var(--grey); padding-left:16px; position:relative}
    ul.list li::before{content:""; position:absolute; left:0; top:9px; width:7px; height:2px; background:var(--magenta)}
    ul.list li b{color:var(--ink)}

    .flow{display:flex; flex-wrap:wrap; align-items:stretch; gap:10px; margin-bottom:20px}
    .node{flex:1 1 150px; min-width:0; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px; text-align:center}
    .node .ic{width:32px;height:32px;margin:0 auto 8px; color:var(--teal)}
    .node .t{font-weight:bold; font-size:13px; color:var(--purple)}
    .node .d{font-size:12px; color:var(--grey); margin-top:4px}
    .arrow{align-self:center; color:var(--rule); font-weight:bold; flex:0 0 auto}

    .params{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:20px}
    .param{border:1px solid var(--border); border-radius:8px; padding:11px 13px; font-size:13px; background:var(--tint2)}
    .param b{color:var(--purple)}
    .param .tag{display:block; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--teal); margin-bottom:3px}

    .boundary{display:grid; grid-template-columns:1fr 1fr; border:1px solid var(--border); border-radius:12px; overflow:hidden; margin-bottom:20px}
    .boundary > div{padding:18px}
    .boundary .verada{background:var(--tint2)}
    .boundary .hosp{background:var(--card); border-left:1px solid var(--border)}
    .boundary h4{margin:0 0 10px; font-size:12.5px; letter-spacing:.06em; text-transform:uppercase}
    .boundary .verada h4{color:var(--magenta)}
    .boundary .hosp h4{color:var(--purple)}
    .boundary ul{margin:0; padding-left:18px; font-size:13px; color:var(--grey)}
    .boundary li{margin-bottom:7px}

    .audiencenote{font-size:12px; color:var(--teal); font-weight:bold; letter-spacing:.02em; margin-bottom:6px}

    /* illustrative case panel */
    .illnote{display:inline-block; font-size:11px; font-weight:bold; letter-spacing:.08em; text-transform:uppercase; color:var(--teal); border:1px solid var(--teal); border-radius:999px; padding:3px 10px; margin-bottom:14px}
    .case{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:16px}
    .case h3{font-size:16px; color:var(--purple); margin-bottom:12px}
    .caseflow{display:flex; flex-wrap:wrap; gap:8px; align-items:stretch}
    
    /* Approach Comparison Table Layout */
    .comp-table { width: 100%; border-collapse: collapse; margin-block: 16px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; font-size: 14px; }
    .comp-table th, .comp-table td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border); }
    .comp-table th { background: var(--tint2); color: var(--purple); font-weight: bold; }
    .comp-table tr:last-child td { border-bottom: none; }

    .disclaimer-box { background: var(--tint); border-radius: 12px; padding: 20px; font-size: 12.5px; color: var(--grey); margin-top: 40px; border: 1px solid var(--border); }
    .disclaimer-box strong { color: var(--purple); }
  </style>
  <script>
    function switchTab(tabId) {
      document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', 'false'));
      document.querySelectorAll('.panel').forEach(p => p.hidden = true);
      const selectedTab = document.getElementById('tab-' + tabId);
      const selectedPanel = document.getElementById('panel-' + tabId);
      if(selectedTab && selectedPanel) {
        selectedTab.setAttribute('aria-selected', 'true');
        selectedPanel.hidden = false;
      }
    }
  </script>
</head>
<body>

  <!-- ---- Cover Section ---- -->
  <header class="cover">
    <div class="wrap">
      <div class="brandrow">
        <img class="brand-img-logo" src="/assets/verada-logo-light.png" alt="Verada Health Logo" />
